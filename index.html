    }
    #game {
      max-width: 700px;

      padding: 20px;
      background: #333;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
    }
    #enemy {
      margin: 20px 0;
    }
    #enemy img {
      width: 150px;
      height: 150px;
    }
    .hp-bar {
      width: 80%;
      height: 25px;
      border: 2px solid #fff;
      border-radius: 5px;
      margin: 10px auto;
      background: #555;
      position: relative;
    }
    .hp-inner {
      height: 100%;
      background: linear-gradient(#f00, #a00);
      width: 100%;
      border-radius: 3px;
      transition: width 0.4s;
    }
    .option {
      display: block;
      margin: 10px auto;
      padding: 10px;
      background: #666;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      width: 80%;
    }
    .option:hover {
      background: #888;
    }
    #message {
      margin-top: 15px;
      font-weight: bold;
    }
    #result {
      text-align: left;
      margin-top: 20px;
      background: #222;
      padding: 15px;
      border-radius: 10px;
    }
    #result h2 {
      text-align: center;
    }
    .mistake {
      margin: 10px 0;
      padding: 10px;
      background: #444;
      border-radius: 6px;
    }
    .rank {
      text-align: center;
      font-size: 1.5em;
      margin: 15px 0;
      font-weight: bold;
    }
    .rank-s { color: gold; }
    .rank-a { color: limegreen; }
    .rank-b { color: deepskyblue; }
    .rank-c { color: crimson; }
    #retryBtn {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 16px;
      background: #666;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #retryBtn:hover {
      background: #888;
    }

/* 爆発アニメーション */
@keyframes explosionAnim {
  0% { transform: translate(-50%, -50%) scale(0.5); opacity:1; }
  50% { transform: translate(-50%, -50%) scale(1.2); opacity:0.8; }
  100% { transform: translate(-50%, -50%) scale(2); opacity:0; }
}
.explosion {
  position:absolute;
  left:50%;
  top:20%;
  width:150px;
  height:150px;
  transform:translate(-50%,-50%) scale(0);
  animation: explosionAnim 0.8s forwards;
  pointer-events:none;
  z-index:10;
}

    let enemyIndex = 0;
    let enemyMaxHP = 5;
    let enemyHP = enemyMaxHP;

    // 成績用
    let correctCount = 0;
    let wrongList = [];

    // 敵の初期化
    function setEnemy() {
      if (enemyIndex >= enemyImages.length) {
        showResult();
        return;
      }
      const img = enemyImages[enemyIndex];
      document.getElementById("enemyImg").src = img;
      enemyHP = enemyMaxHP;
      updateHP();
    }

    // HPバー更新
    function updateHP() {
      const hpPercent = (enemyHP / enemyMaxHP) * 100;
      document.getElementById("enemyHP").style.width = hpPercent + "%";
    }

    // 問題表示
    function showQuestion() {
      if (currentQuestionIndex >= questions.length) {
        showResult();
        return;
      }

 // 前の問題の正解・不正解メッセージを消す
  document.getElementById("message").textContent = "";

      const q = questions[currentQuestionIndex];
      document.getElementById("question").textContent = q.q;
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.className = "option";
        btn.onclick = () => checkAnswer(i);
        optionsDiv.appendChild(btn);
      });
    }

// 回答チェック
function checkAnswer(selected) {
  const q = questions[currentQuestionIndex];
  const optionsDiv = document.getElementById("options");

  // 連続クリックを防ぐため、選択肢を一時的に無効化
  const buttons = optionsDiv.querySelectorAll("button");
  buttons.forEach(btn => btn.disabled = true);

  if (selected === q.answerIndex) {
    enemyHP--;
    updateHP();
    document.getElementById("message").textContent =
      "正解！ 敵にダメージ！";
    correctCount++;

    // 敵を倒した場合
    if (enemyHP <= 0) {
      if (enemyIndex === enemyImages.length - 1) {
        document.getElementById("message").textContent =
          "正解！ 最後の敵を倒した！";

        createExplosion();

        setTimeout(() => {
          showResult();
        }, 1500);

        return;
      } else {
        document.getElementById("message").textContent =
          "正解！ 敵を倒した！";

        enemyIndex++;

        // 問題を次へ
        currentQuestionIndex++;

        setTimeout(() => {
          setEnemy();

          if (currentQuestionIndex >= questions.length) {
            showResult();
          } else {
            showQuestion();
          }
        }, 1000);

        return;
      }
    }

  } else {
    // 不正解時にすぐ正答を表示
    document.getElementById("message").textContent =
      `不正解！ 正解は「${q.options[q.answerIndex]}」です。`;

    // 成績画面の復習用リストにも保存
    wrongList.push({
      question: q.q,
      correct: q.options[q.answerIndex]
    });
  }

  // 次の問題へ進む
  currentQuestionIndex++;

  setTimeout(() => {
    if (currentQuestionIndex >= questions.length) {
      showResult();
    } else {
      showQuestion();
    }
  }, 1500);
}

// 爆発表示
function createExplosion(){
  const enemyDiv = document.getElementById("enemy");
  const explosion = document.createElement("img");
  explosion.src = "bakuhatsu2.png"; // いらすとや爆発画像に置換
  explosion.className = "explosion";
  enemyDiv.appendChild(explosion);
  setTimeout(()=>document.getElementById("enemyImg").style.display="none",600);
}


    // 成績画面表示
    function showResult() {
      document.getElementById("quiz").style.display = "none";
      document.getElementById("enemy").style.display = "none";
      document.querySelector(".hp-bar").style.display = "none";
      document.getElementById("message").style.display = "none";

      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";

      const scorePercent = (correctCount / questions.length) * 100;
      let rankClass = "rank-c";
      let rankText = "Cランク…もっと頑張ろう！";

      if (scorePercent >= 95) { rankClass = "rank-s"; rankText = "Sランク！完璧！✨"; }
      else if (scorePercent >= 70) { rankClass = "rank-a"; rankText = "Aランク！素晴らしい！"; }
      else if (scorePercent >= 50) { rankClass = "rank-b"; rankText = "Bランク！あと少し！"; }

      resultDiv.innerHTML = `<h2>成績発表</h2>
        <p>正解数: ${correctCount} / ${questions.length}</p>
        <p class="rank ${rankClass}">${rankText}</p>`;

      if (wrongList.length > 0) {
        resultDiv.innerHTML += "<h3>間違えた問題を復習しよう！</h3>";
        wrongList.forEach(item => {
          resultDiv.innerHTML += `<div class="mistake"><strong>Q:</strong> ${item.question}<br><strong>正解:</strong> ${item.correct}</div>`;
        });
      } else {
        resultDiv.innerHTML += "<p>全問正解！素晴らしい！🎉</p>";
      }

      // もう一度挑戦ボタン
      resultDiv.innerHTML += `<button id="retryBtn">もう一度挑戦</button>`;
      document.getElementById("retryBtn").onclick = () => location.reload();
    }

    // ゲーム開始
    setEnemy();
    showQuestion();
  </script>
